# cd-main は本番環境へのデプロイを行います。
# タイミングは main ブランチへの push です。

name: cd github pages

on:
  push:
    branches: [ main ]

jobs:

  deploy-to-github-pages:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      id: setup_node_id
      with:
        # package.json の volta.node に書かれたバージョンを使います。
        # engines.node の範囲外だと The engine "node" is incompatible with this module. エラーで yarn install が失敗します。
        node-version-file: package.json

    - uses: actions/cache@v6
      id: node_modules_cache_id
      with:
        path: |
          node_modules
        key: node-${{ steps.setup_node_id.outputs.node-version }}-deps-${{ hashFiles(format('{0}{1}', github.workspace, '/yarn.lock')) }}

    - run: yarn install --frozen-lockfile

    # NOTE: build では lint が実行されないため、デプロイ前に実行します。
    - run: yarn lint

    - run: yarn build:production

    - uses: peaceiris/actions-gh-pages@v3
      with:
        personal_token: ${{ secrets.PERSONAL_TOKEN }}
        publish_dir: ./dist
        # NOTE: カスタムドメインで運用するときは必要です。
        # cname: ${{ secrets.CUSTOM_DOMAIN_FOR_THIS_REPOSITORY }}
