# ci は lint, test, build と、 Docker イメージのビルド・スモークテストを行います。
# タイミングは main, dev 両ブランチへの push, pr です。

name: ci

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

  workflow_dispatch:

jobs:

  lint-and-test-with-cache:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      id: setup_node_id
      with:
        # package.json の volta.node に書かれたバージョンを使います。
        node-version-file: package.json
        # NOTE: cache option を使いません。
        #       actions/cache で node_modules をキャッシュしたほうが yarn install が高速で終わるためです。

    - uses: actions/cache@v6
      id: node_modules_cache_id
      with:
        path: |
          node_modules
        key: node-${{ steps.setup_node_id.outputs.node-version }}-deps-${{ hashFiles(format('{0}{1}', github.workspace, '/yarn.lock')) }}

    - run: yarn install --frozen-lockfile

    - run: yarn lint

    - run: yarn test:unit

    - run: yarn build:production

  docker-build-and-smoke-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # README の手順どおりにイメージをビルドし、 healthy になるまで待ちます。
    - run: docker compose up -d --build --wait

    - run: docker/smoke-test.sh

    # README に書いた Docker での lint と unit test です。
    - run: docker build --target check .

    - if: failure()
      run: docker compose logs

    - if: always()
      run: docker compose down --rmi local
