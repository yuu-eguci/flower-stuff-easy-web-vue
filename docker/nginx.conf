# yarn build:production の成果物を公開パス /flower-stuff-easy-web-vue/ で配信します。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/app;

    server_tokens off;
    # リダイレクトの Location を相対パスにし、ホスト側のポートを保ちます。
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = / {
        return 302 /flower-stuff-easy-web-vue/;
    }

    # history モードのルータのパス (/media など) へ直接アクセスしたときは index.html を返します。
    location /flower-stuff-easy-web-vue/ {
        try_files $uri $uri/ /flower-stuff-easy-web-vue/index.html;
    }

    # 更新をすぐ反映するため、毎回検証させます。
    location = /flower-stuff-easy-web-vue/index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flower-stuff-easy-web-vue/service-worker.js {
        add_header Cache-Control "no-cache";
    }

    # 静的ファイルが無いときは index.html ではなく 404 を返します。
    location ~ ^/flower-stuff-easy-web-vue/(js|css|img|fonts)/ {
        try_files $uri =404;
    }
}
